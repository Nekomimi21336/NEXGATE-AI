<div class="sidebar-region" id="sidebarRegion">
  <div class="sidebar-shell page-load-animate">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <a href="/chat" class="logo logo-brand" data-text="NEXGATE AI">NEXGATE AI</a>
          <span class="sidebar-brand-experiment">experiment</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarExtensionsNav">
        <a href="/tasks" class="nav-item nav-item--with-icon{% if not user.tasks_enabled %} hidden{% endif %}" id="sidebarTasksLink" aria-hidden="{{ 'false' if user.tasks_enabled else 'true' }}">
          <svg class="nav-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
          <span data-i18n="sidebarTasks">TASKS</span>
        </a>
        <a href="/projects" class="nav-item nav-item--with-icon{% if not user.projects_enabled %} hidden{% endif %}" id="sidebarProjectsLink" aria-hidden="{{ 'false' if user.projects_enabled else 'true' }}">
          <svg class="nav-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          <span data-i18n="sidebarProjects">Projects [BETA]</span>
        </a>
        <a href="/chat" class="nav-item nav-item--with-icon" id="sidebarChatLink">
          <svg class="nav-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
          <span data-i18n="sidebarChat">チャット</span>
        </a>
        <a href="/ask-expert" class="nav-item nav-item--with-icon{% if not user.info_expert_enabled %} hidden{% endif %}" id="sidebarAskExpertLink" aria-hidden="{{ 'false' if user.info_expert_enabled else 'true' }}">
          <svg class="nav-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-4.9 11.9L2 22l8.2-4.6A7 7 0 1 0 12 2zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm-2.8 8.2.3.1 2.5 1.4-2.5-3.5-.3-.1a5.01 5.01 0 0 1-2.9 2.1z"/></svg>
          <span data-i18n="sidebarAskExpert">AskExpert</span>
        </a>
      </nav>
      <div class="sidebar-session-panel" id="sidebarSessionPanel">
        <button type="button" class="new-chat-btn" id="newChatBtn" data-i18n="newChat">+ 新しいチャット</button>
        <div class="sidebar-session-search" id="sidebarSessionSearch">
          <i class="bi bi-search sidebar-session-search-icon" aria-hidden="true"></i>
          <input type="search" class="sidebar-session-search-input" id="sidebarSessionSearchInput" placeholder="セッションを検索..." autocomplete="off" data-i18n-placeholder="sidebarSearchSessions">
          <button type="button" class="sidebar-session-search-clear hidden" id="sidebarSessionSearchClear" aria-label="検索をクリア">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <div class="chat-history" id="chatHistory"></div>
      </div>
      <div class="sidebar-project-panel hidden" id="sidebarProjectPanel" aria-hidden="true">
        <nav class="project-sidebar-nav" id="projectSidebarNav" aria-label="Project navigation"></nav>
      </div>
      <div class="sidebar-ask-expert-panel hidden" id="sidebarAskExpertPanel" aria-hidden="true">
        <button type="button" class="new-chat-btn" id="askExpertCreateBtn" data-i18n="askExpertCreate">+ 専門家を作成</button>
        <div class="chat-history ask-expert-history" id="askExpertSessionHistory" aria-label="Expert sessions"></div>
      </div>
      <div class="sidebar-footer">
        <div class="announcements-tab" id="announcementsTab">
          <a href="/announcements" class="sidebar-footer-btn" id="announcementsTabBtn">
            <span class="sidebar-footer-btn-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2 2 0 0 0 2-2H10a2 2 0 0 0 2 2zm6-6V11a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2z"/></svg>
            </span>
            <span class="sidebar-footer-btn-label" data-i18n="sidebarAnnouncements">お知らせ</span>
            <span class="announcements-badge hidden" id="announcementsUnreadBadge" aria-hidden="true"></span>
          </a>
        </div>
      <div class="account-tab" id="accountTab">
        <button type="button" class="account-btn" id="accountBtn" aria-expanded="false" aria-haspopup="true">
          <span class="account-avatar" id="accountAvatar">U</span>
          <span class="account-details">
            <span class="account-plan" id="accountPlan" data-plan="{{ user.plan }}">
              <span class="account-plan-name" id="accountPlanName">{{ user.plan_name }}</span>
              <span class="account-plan-price" id="accountPlanPrice">{{ user.plan_price_label }}</span>
            </span>
            <span class="account-name" id="accountName">{{ user.display_name }}</span>
          </span>
        </button>
        <div class="account-menu hidden" id="accountMenu" role="menu">
          <a href="/api/auth/go-portal" class="account-menu-item{% if not user.api_access_active %} hidden{% endif %}" id="accountApiPlatformLink" role="menuitem" target="_blank" rel="noopener noreferrer" aria-hidden="{{ 'false' if user.api_access_active else 'true' }}">API Platform</a>
          <a href="/billing" class="account-menu-item" role="menuitem">プラン/課金</a>
          <a href="/settings" class="account-menu-item" role="menuitem" data-i18n="settings">設定</a>
          {% if user.role == 'admin' %}
          <a href="/admin" class="account-menu-item" role="menuitem">管理機能</a>
          {% endif %}
          <button type="button" class="account-menu-item account-menu-item--danger" id="logoutBtn" role="menuitem" data-i18n="logout">ログアウト</button>
        </div>
      </div>
      </div>
    </aside>
  </div>
  <button type="button" class="sidebar-toggle page-load-animate" id="sidebarToggle" aria-label="サイドバーを開閉" aria-expanded="true">
    <span class="sidebar-toggle-icon-wrap" aria-hidden="true">
      <svg class="sidebar-toggle-icon sidebar-toggle-icon--open" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      <svg class="sidebar-toggle-icon sidebar-toggle-icon--closed" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </span>
  </button>
</div>

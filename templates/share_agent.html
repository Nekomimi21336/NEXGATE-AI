<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ agent.name }} - NEXGATE AI</title>
  {% include 'partials/theme_script.html' %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body.share-page { margin: 0; min-height: 100vh; background: var(--bg-primary); color: var(--text-primary); }
    .share-shell { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
    .share-brand { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); margin: 0 0 8px; }
    .share-title { margin: 0 0 12px; font-size: 1.35rem; font-weight: 600; }
    .share-desc { margin: 0; line-height: 1.6; color: var(--text-secondary); white-space: pre-wrap; }
    .share-meta { margin-top: 20px; font-size: 0.85rem; color: var(--text-secondary); }
  </style>
</head>
<body class="share-page">
  <main class="share-shell">
    <p class="share-brand">NEXGATE AI · エージェント</p>
    <h1 class="share-title">{{ agent.name }}</h1>
    {% if agent.description %}
    <p class="share-desc">{{ agent.description }}</p>
    {% endif %}
    <p class="share-meta">
      {% if agent.visibility == 'public' %}
      利用者数: {{ agent.usage_count }}
      {% endif %}
    </p>
  </main>
</body>
</html>

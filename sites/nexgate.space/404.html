<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません — NEXGATE AI</title>
  <link rel="stylesheet" href="/legal.css">
  <style>
    .error-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
    }

    .error-code {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--text-subtle);
      margin-bottom: 20px;
    }

    .error-title {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .error-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.8;
      max-width: 420px;
      margin-bottom: 36px;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      padding: 12px 28px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      transition: background 0.2s, border-color 0.2s;
    }

    .error-btn:hover {
      background: var(--surface);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="ambient-backdrop" aria-hidden="true">
    <span class="ambient-layer--a"></span>
    <span class="ambient-layer--b"></span>
  </div>

  <div class="site-shell">
    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="header-logo">NEXGATE AI</a>
        <nav class="header-nav" aria-label="メインナビゲーション">
          <a href="index.html">トップ</a>
        </nav>
      </div>
    </header>

    <main class="error-page">
      <p class="error-code">404 Not Found</p>
      <h1 class="error-title">ページが存在しません</h1>
      <p class="error-desc">お探しのページは移動または削除されたか、URL が間違っている可能性があります。</p>
      <a href="index.html" class="error-btn">ホームに戻る</a>
    </main>
  </div>
</body>
</html>
